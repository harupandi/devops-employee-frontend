name: Frontend CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    permissions: 
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  

  test:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test
  

  build-and-scan:
    name: Build and Scan Docker Image
    needs: 
      - test
      - secret-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -t devops-employee-frontend:${{ github.sha }} \
            .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-employee-frontend:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      
      - name: Save Docker image
        run: |
          docker save \
            devops-employee-frontend:${{ github.sha }} \
            -o devops-employee-frontend.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-employee-frontend-${{ github.sha }}
          path: devops-employee-frontend.tar
          retention-days: 1
  

  push-to-acr:
    name: Push Docker Image to ACR
    needs: build-and-scan
    environment: frontend-acr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: devops-employee-frontend-${{ github.sha }}

      - name: Load Docker image
        run: |
          docker load \
            --input devops-employee-frontend.tar

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Tag Docker image
        run: |
          docker tag \
            devops-employee-frontend:${{ github.sha }} \
            ${{ vars.ACR_LOGIN_SERVER }}/devops-employee-frontend:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/devops-employee-frontend:${{ github.sha }}